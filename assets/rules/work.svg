<title>Section: selected work</title>
<style>text{font-family:ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;}</style>
<rect x="0" y="17" width="4" height="13" fill="#4f9ff2" opacity="0">
  <animate attributeName="opacity" to="1" dur="0.3s" begin="0s" fill="freeze"/></rect>
<text x="14" y="28" font-size="13.5" font-weight="600" fill="#e8eef5" opacity="0">
